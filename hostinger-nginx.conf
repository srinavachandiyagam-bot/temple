# ====================================================================
# Hostinger VPS Nginx Reverse Proxy Configuration
# ====================================================================
# Location on VPS: /etc/nginx/sites-available/temple
# Symlink: ln -s /etc/nginx/sites-available/temple /etc/nginx/sites-enabled/
# Test config: nginx -t
# Reload: systemctl reload nginx
# ====================================================================

# 1. HTTP Server - Redirects to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name yourtempledomain.com www.yourtempledomain.com;

    return 301 https://$host$request_uri;
}

# 2. HTTPS Server - Reverse Proxy to Node.js on port 3000
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourtempledomain.com www.yourtempledomain.com;

    # SSL Certificates (Automatically installed via Certbot / Let's Encrypt)
    # sudo certbot --nginx -d yourtempledomain.com -d www.yourtempledomain.com
    # ssl_certificate /etc/letsencrypt/live/yourtempledomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourtempledomain.com/privkey.pem;

    # Maximum payload size for photo/video uploads (allows up to 160MB videos)
    client_max_body_size 160M;

    # Proxy to Node.js application
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }

    # Static media caching
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /videos/ {
        proxy_pass http://127.0.0.1:3000/videos/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
